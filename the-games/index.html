<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Games — The Realms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="games.css">
</head>
<body>

    <div class="topbar">
        <span class="crumbs">
            <a href="../index.html">The Realms</a>
            <span class="sep">/</span>
            <span class="current">Games</span>
        </span>
        <a class="back-link" href="../index.html">← Back</a>
    </div>

    <header class="hero">
        <h1 class="hero-title">The Games</h1>
    </header>

    <main class="games">

        <section class="game-row">
            <div class="game-visual">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M36 4 L14 36 H28 L24 60 L52 26 H36 L40 4 Z"
                          stroke="#7CAFFB" stroke-width="2.5" stroke-linejoin="round" fill="rgba(59,130,246,0.15)"/>
                </svg>
            </div>
            <div class="game-content">
                <h2 class="game-name">Stackrift</h2>
                <p class="game-tagline">Every miss gets cut away.</p>
                <div class="game-meta">
                    <span class="meta-status"><span class="status-dot live"></span>Live</span>
                    <span>Web</span>
                </div>
                <a class="btn-enter" href="../Stackrift/index.html">
                    Enter Stackrift
                    <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
            </div>
        </section>

        <section class="game-row">
            <div class="game-visual">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="30" width="8" height="24" rx="2" fill="rgba(59,130,246,0.25)" stroke="#7CAFFB" stroke-width="2"/>
                    <rect x="28" y="16" width="8" height="38" rx="2" fill="rgba(59,130,246,0.35)" stroke="#7CAFFB" stroke-width="2"/>
                    <rect x="46" y="24" width="8" height="30" rx="2" fill="rgba(59,130,246,0.25)" stroke="#7CAFFB" stroke-width="2"/>
                </svg>
            </div>
            <div class="game-content">
                <h2 class="game-name">Acent</h2>
                <p class="game-tagline">In development.</p>
                <div class="game-meta">
                    <span class="meta-status"><span class="status-dot dev"></span>In development</span>
                    <span>Web</span>
                </div>
                <a class="btn-enter" href="../acent/index.html">
                    Enter Acent
                    <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
            </div>
        </section>

    </main>

</body>
</html>
